name: Anthropic OIDC Example

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  messages:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange GitHub identity token
        uses: actions/github-script@v8
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        with:
          script: |
            const { FEDERATION_RULE_ID, ORGANIZATION_ID, SERVICE_ACCOUNT_ID, WORKSPACE_ID } = process.env;
            if (!FEDERATION_RULE_ID || !ORGANIZATION_ID || !SERVICE_ACCOUNT_ID) {
              throw new Error('Set the Anthropic federation rule, organization, and service account variables.');
            }
            const assertion = await core.getIDToken('https://api.anthropic.com');
            const body = {
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion,
              federation_rule_id: FEDERATION_RULE_ID,
              organization_id: ORGANIZATION_ID,
              service_account_id: SERVICE_ACCOUNT_ID,
              ...(WORKSPACE_ID ? { workspace_id: WORKSPACE_ID } : {}),
            };
            const response = await fetch('https://api.anthropic.com/v1/oauth/token', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'anthropic-beta': 'oauth-2025-04-20,oidc-federation-2026-04-01',
              },
              body: JSON.stringify(body),
            });
            if (!response.ok) throw new Error(`Token exchange failed (HTTP ${response.status}).`);
            const { access_token } = await response.json().catch(() => {
              throw new Error('Token exchange returned invalid JSON.');
            });
            if (typeof access_token !== 'string' || !access_token || /[\r\n]/.test(access_token)) {
              throw new Error('Token exchange did not return a valid access token.');
            }
            core.setSecret(access_token);
            core.exportVariable('ANTHROPIC_ACCESS_TOKEN', access_token);

      - name: Call Anthropic Messages API
        uses: actions/github-script@v8
        env:
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
        with:
          script: |
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'authorization': 'Bearer ' + process.env.ANTHROPIC_ACCESS_TOKEN,
                'anthropic-version': '2023-06-01',
                'anthropic-beta': 'oauth-2025-04-20',
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                model: process.env.ANTHROPIC_MODEL,
                max_tokens: 256,
                messages: [{
                  role: 'user',
                  content: 'Briefly summarize this repository workflow: validate plugin manifests on relevant changes, scan external plugins on marketplace or policy changes, and periodically update pinned plugin SHAs.',
                }],
              }),
            });
            if (!response.ok) throw new Error(`Messages request failed (HTTP ${response.status}).`);
            const result = await response.json();
            const text = result.content?.filter(block => block.type === 'text').map(block => block.text).join('\n');
            if (!text) throw new Error('Messages response contained no text.');
            await core.summary.addHeading('Anthropic response').addCodeBlock(text).write();
